<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something Fishy - Orders</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f9;
            color: #222;
        }

        header {
            background: #0077b6;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 5px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .refresh-btn {
            background: #0077b6;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .orders {
            display: grid;
            gap: 15px;
        }

        .order-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .paid {
            color: green;
            font-weight: bold;
        }

        .order-details {
            line-height: 1.8;
        }

        .empty {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            .container {
                width: 92%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🐟 Something Fishy</h1>
    <p>Admin Orders Dashboard</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Customer Orders</h2>
        <button class="refresh-btn" onclick="loadOrders()">
            🔄 Refresh Orders
        </button>
    </div>

    <div id="orders" class="orders">
        <div class="empty">
            Loading orders...
        </div>
    </div>

</div>

<script>
   async function loadOrders() {

    const ordersContainer =
        document.getElementById("orders");

    ordersContainer.innerHTML = `
        <div class="empty">
            Loading orders...
        </div>
    `;

    try {

        const response =
            await fetch("/api/orders");

        const result =
            await response.json();

        if (!result.success || result.orders.length === 0) {

            ordersContainer.innerHTML = `
                <div class="empty">
                    <h3>No orders yet 🐟</h3>
                    <p>Paid customer orders will appear here.</p>
                </div>
            `;

            return;
        }

        ordersContainer.innerHTML = "";

        result.orders.reverse().forEach(order => {

            const items = order.items.map(item =>
                `• ${item.name} — KSh ${Number(item.price).toLocaleString()}`
            ).join("<br>");

            const card =
                document.createElement("div");

            card.className = "order-card";

            card.innerHTML = `
                <div class="order-header">
                    <div>
                        <h3>🧾 ${order.orderId}</h3>
                    </div>

                    <div class="paid">
                        ${order.status === "PAID"
                            ? "✅ PAID"
                            : "⏳ PENDING"}
                    </div>
                </div>

                <div class="order-details">

                    <strong>Customer:</strong>
                    ${order.customerName}
                    <br>

                    <strong>Phone:</strong>
                    ${order.phone}
                    <br>

                    <strong>Location:</strong>
                    ${order.location}
                    <br><br>

                    <strong>Items:</strong>
                    <br>
                    ${items}

                    <br><br>

                    <strong>Total:</strong>
                    KSh ${Number(order.amount).toLocaleString()}

                    <br>

                    <strong>M-Pesa Receipt:</strong>
                    ${order.mpesaReceipt || "Waiting for payment"}

                    <br>

                    <strong>Order Time:</strong>
                    ${new Date(order.createdAt).toLocaleString()}

                </div>
            `;

            ordersContainer.appendChild(card);

        });

    } catch (error) {

        console.error("Orders error:", error);

        ordersContainer.innerHTML = `
            <div class="empty">
                ❌ Could not load orders.
            </div>
        `;
    }
}

loadOrders();
</script>

</body>
</html>
